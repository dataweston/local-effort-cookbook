<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local Effort Cookbook Data</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        color: #1a1a1a;
        background: #f6f4ef;
      }
      main {
        max-width: 720px;
        margin: 64px auto;
        padding: 0 24px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 32px;
      }
      p {
        line-height: 1.5;
      }
      ul {
        padding-left: 20px;
      }
      code {
        background: #ece7dd;
        padding: 2px 6px;
        border-radius: 4px;
      }
      a {
        color: #0a4aa6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Local Effort Cookbook Data</h1>
      <p>
        This deployment serves a static JSON snapshot for the cookbook UI.
        The dataset is available under <code>/cookbook</code>.
      </p>
      <ul>
        <li><a href="/cookbook/index.json">index.json (all recipes)</a></li>
        <li><a href="/cookbook/recipes/100best4ingredie0000unse%23recipe-1.json">sample recipe</a></li>
      </ul>
      <p>
        The source files live in <code>cookbook-migration/public-cookbook/</code>.
      </p>
    </main>
  </body>
</html>
